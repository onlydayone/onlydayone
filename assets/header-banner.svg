<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .name { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 54px; letter-spacing: 6px; fill: #ffffff; }
  .sub { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 1px; fill: #22C55E; }
  .ach { font-family: 'Fira Code', monospace; font-weight: 600; font-size: 16px; fill: #A7F3D0; text-anchor: middle; }
  .status-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 2px; fill: #ffffff; }
  .corner { stroke: #22C55E; stroke-width: 2; fill: none; opacity: .8; }
  .glowbar { animation: pulse 2.6s ease-in-out infinite; }
  .trace { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 30 250; animation: travel 3.2s linear infinite; }
  @keyframes travel { to { stroke-dashoffset: -400; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes scan { 0% { transform: translateY(-40px); } 100% { transform: translateY(380px); } }
  @keyframes glitch {
    0%, 92%, 100% { transform: translate(0,0); opacity: 0; }
    93% { transform: translate(-3px,1px); opacity: .7; }
    95% { transform: translate(3px,-1px); opacity: .7; }
    97% { transform: translate(-2px,0); opacity: .5; }
  }
  @keyframes fade1 { 0%,5%{opacity:0} 8%{opacity:1} 28%{opacity:1} 31%{opacity:0} 100%{opacity:0} }
  @keyframes fade2 { 0%,34%{opacity:0} 37%{opacity:1} 61%{opacity:1} 64%{opacity:0} 100%{opacity:0} }
  @keyframes fade3 { 0%,67%{opacity:0} 70%{opacity:1} 94%{opacity:1} 97%{opacity:0} 100%{opacity:0} }
  .line1 { animation: fade1 10s infinite; }
  .line2 { animation: fade2 10s infinite; }
  .line3 { animation: fade3 10s infinite; }
</style>

<radialGradient id="bgGrad" cx="50%" cy="20%" r="90%">
  <stop offset="0%" stop-color="#0B1120"/>
  <stop offset="45%" stop-color="#071210"/>
  <stop offset="100%" stop-color="#020503"/>
</radialGradient>

<radialGradient id="vignette" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
</radialGradient>

<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#22C55E"><animate attributeName="stop-color" values="#22C55E;#166534;#22C55E" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#166534"><animate attributeName="stop-color" values="#166534;#22C55E;#166534" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>

<linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="10" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- Background -->
<rect x="0" y="0" width="900" height="360" rx="18" fill="url(#bgGrad)"/>
<rect x="0" y="0" width="900" height="360" rx="18" fill="url(#vignette)"/>
<rect x="3" y="3" width="894" height="354" rx="16" fill="none" stroke="url(#frameGrad)" stroke-width="2" opacity="0.6"/>

<!-- Corner accents -->
<path class="corner" d="M24 55 L24 24 L55 24"/>
<path class="corner" d="M876 55 L876 24 L845 24"/>
<path class="corner" d="M24 305 L24 336 L55 336"/>
<path class="corner" d="M876 305 L876 336 L845 336"/>

<!-- Scan line -->
<rect x="0" y="0" width="900" height="40" fill="url(#scanGrad)" style="animation: scan 6s linear infinite;"/>

<!-- Name with glow + glitch -->
<text x="450" y="110" text-anchor="middle" class="name" filter="url(#softglow)">ONLYDAYONE</text>
<text x="447" y="110" text-anchor="middle" class="name" fill="#22C55E" style="animation: glitch 7s infinite;">ONLYDAYONE</text>
<text x="453" y="110" text-anchor="middle" class="name" fill="#166534" style="animation: glitch 7s infinite .1s;">ONLYDAYONE</text>

<!-- Subtitle -->
<text x="450" y="148" text-anchor="middle" class="sub">MOBILE &amp; WEB DEVELOPER · IOT EXPLORER · LIFELONG LEARNER</text>

<!-- Glowing bar -->
<rect class="glowbar" x="380" y="166" width="140" height="2.5" fill="#22C55E" filter="url(#glow)"/>

<!-- Fading lines (one at a time, no overlap) -->
<text x="450" y="220" class="ach line1">📱 Building — SkillBantuin App</text>
<text x="450" y="220" class="ach line2">💬 Developing — JavaLan Messenger</text>
<text x="450" y="220" class="ach line3">🔬 Exploring — IoT &amp; Arduino Projects</text>

<!-- Open to collaborate button -->
<g>
<rect x="318" y="260" width="264" height="42" rx="10" fill="#0B1120" stroke="#22C55E" stroke-width="1.4" filter="url(#glow)"/>
<rect class="trace" x="318" y="260" width="264" height="42" rx="10" stroke="#22C55E"/>
<circle cx="340" cy="281" r="4" fill="#22c55e"/>
<text x="454" y="286" text-anchor="middle" class="status-text">OPEN TO COLLABORATE</text>
</g>
</svg>
